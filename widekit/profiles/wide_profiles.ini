# widekit per-game profiles - starter table.
#
# The table ships EMPTY on purpose.  Every entry must be verified against the
# real ROM (with the adapter's self-check and screenshots) before it is added;
# do not copy addresses from memory or from other emulators' notes.
#
# Keys are documented in include/wk_profile.h.  Safe defaults when a game has
# no section (or a key is missing): everything automatic (enable = auto, all
# layers auto, no margin limit, no lead cap, no level map).
#
# Section header: crc32 of the ROM (header stripped, as the player computes it)
# and/or the internal title.  crc32 wins over title.
#
# ---- documented examples (fictional games; kept commented out) ---------------
#
# A platformer whose BG3 is the status bar and whose sky layer is BG2:
#
# [crc32=00000000 title="EXAMPLE PLATFORMER"]
# enable      = auto
# bg1         = level          # the playfield
# bg2         = backdrop       # parallax sky: wrap it over the whole margin
# bg3         = hud            # status bar stays centred
# margin      = 48
# lead_tiles  = 2              # the engine keeps 2 columns ahead of the camera
#
# A NES game with a status bar at the top done by a sprite-0 split:
#
# [title="EXAMPLE NES GAME"]
# hud_lines   = 0-31
# margin_left = 40
# margin_right = 40
#
# A game that keeps its level as a grid of 16x16 metatiles in RAM, so the
# adapter can read the real level ahead of the camera (addr/w/h are made up):
#
# [crc32=00000000 title="EXAMPLE METATILE GAME"]
# levelmap = layer=0 addr=0x1000 w=128 h=12 cell=16 bytes=1 endian=little stride=128 origin=0,0 meta=2x2 tiles=linear:0x40,4
#
# A game where each metatile value selects four arbitrary tiles:
#
# levelmap = layer=0 addr=0x2000 w=32 h=8 cell=16 bytes=1 meta=2x2 tiles=table:0=0x10,0x11,0x12,0x13|1=0x20,0x21,0x22,0x23
